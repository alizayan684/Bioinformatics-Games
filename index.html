<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Alignment Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        let seq1 = "", seq2 = "";
        let matrix = [];
        let history = [];
        let currentStep = 0;
        let isGuessMode = false;
        let isAutoRunning = false;
        let autoInterval = null;
        let maxScore = 0;
        let maxPos = { i: 0, j: 0 };
        const seq1Input = document.getElementById('seq1');
        const seq2Input = document.getElementById('seq2');
        const matchScoreInput = document.getElementById('match-score');
        const mismatchScoreInput = document.getElementById('mismatch-score');
        const gapScoreInput = document.getElementById('gap-score');
        const initBtn = document.getElementById('init-btn');
        const backBtn = document.getElementById('back-btn');
        const forwardBtn = document.getElementById('forward-btn');
        const guessModeBtn = document.getElementById('guess-mode-btn');
        const autoBtn = document.getElementById('auto-btn');
        const matrixTable = document.getElementById('matrix-table');
        const stepCountEl = document.getElementById('step-count');
        const currentCellEl = document.getElementById('current-cell');
        const maxScoreDisplayEl = document.getElementById('max-score-display');
        const alignmentResultEl = document.getElementById('alignment-result');
        const alignmentContentEl = document.getElementById('alignment-content');

        function initGame() {
            seq1 = seq1Input.value.toUpperCase().trim();
            seq2 = seq2Input.value.toUpperCase().trim();
            if (!seq1 || !seq2) { alert('Please enter both sequences!'); return; }
            matrix = [];
            for (let i = 0; i <= seq2.length; i++) {
                matrix[i] = [];
                for (let j = 0; j <= seq1.length; j++) { matrix[i][j] = 0; }
            }
            history = [{ matrix: JSON.parse(JSON.stringify(matrix)), step: 0, maxScore: 0, maxPos: { i: 0, j: 0 } }];
            currentStep = 0; maxScore = 0; maxPos = { i: 0, j: 0 };
            isAutoRunning = false; clearInterval(autoInterval);
            autoBtn.classList.remove('active'); autoBtn.innerHTML = 'Auto Run';
            renderMatrix(); updateButtons(); updateStatus();
            alignmentResultEl.style.display = 'none';
        }

        function renderMatrix() {
            matrixTable.innerHTML = '';
            for (let i = 0; i <= seq2.length; i++) {
                const row = document.createElement('tr');
                for (let j = 0; j <= seq1.length; j++) {
                    const cell = document.createElement('td');
                    if (i === 0 && j === 0) { cell.className = 'empty'; }
                    else if (i === 0) { cell.className = 'seq1'; cell.textContent = seq1[j - 1]; }
                    else if (j === 0) { cell.className = 'seq2'; cell.textContent = seq2[i - 1]; }
                    else {
                        cell.textContent = matrix[i][j];
                        cell.dataset.i = i; cell.dataset.j = j;
                        if (history[currentStep] && history[currentStep].currentI === i && history[currentStep].currentJ === j) {
                            cell.classList.add('current');
                        }
                        if (i === maxPos.i && j === maxPos.j && maxScore > 0) { cell.classList.add('max-score'); }
                    }
                    row.appendChild(cell);
                }
                matrixTable.appendChild(row);
            }
        }

        function calculateNextCell() {
            if (currentStep >= seq1.length * seq2.length) { finishAlgorithm(); return false; }
            const i = Math.floor(currentStep / seq1.length) + 1;
            const j = (currentStep % seq1.length) + 1;
            const matchScore = parseInt(matchScoreInput.value);
            const mismatchScore = parseInt(mismatchScoreInput.value);
            const gapScore = parseInt(gapScoreInput.value);
            const diagScore = matrix[i - 1][j - 1] + (seq1[j - 1] === seq2[i - 1] ? matchScore : mismatchScore);
            const upScore = matrix[i - 1][j] + gapScore;
            const leftScore = matrix[i][j - 1] + gapScore;
            const newScore = Math.max(0, diagScore, upScore, leftScore);
            matrix[i][j] = newScore;
            if (newScore > maxScore) { maxScore = newScore; maxPos = { i, j }; }
            currentStep++;
            history.push({
                matrix: JSON.parse(JSON.stringify(matrix)), step: currentStep,
                currentI: i, currentJ: j, maxScore: maxScore, maxPos: { ...maxPos },
                calcDetails: { diagScore, upScore, leftScore, newScore, isMatch: seq1[j - 1] === seq2[i - 1] }
            });
            renderMatrix(); updateButtons(); updateStatus(); return true;
        }

        function updateButtons() {
            backBtn.disabled = currentStep === 0;
            forwardBtn.disabled = currentStep >= seq1.length * seq2.length;
        }

        function updateStatus() {
            stepCountEl.textContent = currentStep;
            maxScoreDisplayEl.textContent = maxScore;
            if (history[currentStep] && history[currentStep].currentI) {
                currentCellEl.textContent = '(' + history[currentStep].currentI + ', ' + history[currentStep].currentJ + ')';
            } else { currentCellEl.textContent = '-'; }
        }

        function goBack() {
            if (currentStep > 0) {
                currentStep--;
                const state = history[currentStep];
                matrix = JSON.parse(JSON.stringify(state.matrix));
                maxScore = state.maxScore; maxPos = { ...state.maxPos };
                renderMatrix(); updateButtons(); updateStatus();
            }
        }

        function goForward() {
            if (currentStep < history.length - 1) {
                currentStep++;
                const state = history[currentStep];
                matrix = JSON.parse(JSON.stringify(state.matrix));
                maxScore = state.maxScore; maxPos = { ...state.maxPos };
                renderMatrix(); updateButtons(); updateStatus();
            }
        }

        function finishAlgorithm() {
            if (maxScore === 0) return;
            const alignment = traceback();
            displayAlignment(alignment);
            if (isGuessMode) {
                createConfetti();
                setTimeout(() => { document.getElementById('celebration-modal').classList.add('active'); }, 500);
            }
        }

        function traceback() {
            let i = maxPos.i, j = maxPos.j;
            let seq1Aligned = '', seq2Aligned = '', matchLine = '';
            while (i > 0 && j > 0 && matrix[i][j] > 0) {
                const matchScore = parseInt(matchScoreInput.value);
                const mismatchScore = parseInt(mismatchScoreInput.value);
                const gapScore = parseInt(gapScoreInput.value);
                const currentScore = matrix[i][j];
                const diagScore = matrix[i - 1][j - 1];
                const upScore = matrix[i - 1][j];
                const leftScore = matrix[i][j - 1];
                if (currentScore === diagScore + (seq1[j - 1] === seq2[i - 1] ? matchScore : mismatchScore)) {
                    seq1Aligned = seq1[j - 1] + seq1Aligned;
                    seq2Aligned = seq2[i - 1] + seq2Aligned;
                    matchLine += (seq1[j - 1] === seq2[i - 1] ? '|' : ' ');
                    i--; j--;
                } else if (currentScore === upScore + gapScore) {
                    seq1Aligned = '-' + seq1Aligned;
                    seq2Aligned = seq2[i - 1] + seq2Aligned;
                    matchLine += ' '; i--;
                } else {
                    seq1Aligned = seq1[j - 1] + seq1Aligned;
                    seq2Aligned = '-' + seq2Aligned;
                    matchLine += ' '; j--;
                }
            }
            return { seq1: seq1Aligned, seq2: seq2Aligned, match: matchLine };
        }

        function displayAlignment(alignment) {
            alignmentResultEl.style.display = 'block';
            alignmentContentEl.innerHTML = '<div>' + alignment.seq1.split('').map((c, i) => {
                if (c === '-') return '<span class="gap">-</span>';
                if (alignment.seq2[i] === '-') return '<span class="gap">' + c + '</span>';
                if (c === alignment.seq2[i]) return '<span class="match">' + c + '</span>';
                return '<span class="mismatch">' + c + '</span>';
            }).join('') + '</div><div style="color: var(--neon-cyan);">' + alignment.match + '</div><div>' + alignment.seq2.split('').map((c, i) => {
                if (c === '-') return '<span class="gap">-</span>';
                if (alignment.seq1[i] === '-') return '<span class="gap">' + c + '</span>';
                if (c === alignment.seq1[i]) return '<span class="match">' + c + '</span>';
                return '<span class="mismatch">' + c + '</span>';
            }).join('') + '</div><div style="margin-top: 16px; color: var(--text-muted);">Score: <span style="color: var(--neon-pink); font-weight: 600;">' + maxScore + '</span></div>';
            highlightPath();
        }

        function highlightPath() {
            let i = maxPos.i, j = maxPos.j;
            while (i > 0 && j > 0 && matrix[i][j] > 0) {
                const cell = document.querySelector('td[data-i="' + i + '"][data-j="' + j + '"]');
                if (cell) cell.classList.add('path');
                const matchScore = parseInt(matchScoreInput.value);
                const mismatchScore = parseInt(mismatchScoreInput.value);
                const gapScore = parseInt(gapScoreInput.value);
                const currentScore = matrix[i][j];
                const diagScore = matrix[i - 1][j - 1];
                const upScore = matrix[i - 1][j];
                const leftScore = matrix[i][j - 1];
                if (currentScore === diagScore + (seq1[j - 1] === seq2[i - 1] ? matchScore : mismatchScore)) { i--; j--; }
                else if (currentScore === upScore + gapScore) { i--; }
                else { j--; }
            }
        }

        let currentGuessCell = null;
        function toggleGuessMode() {
            isGuessMode = !isGuessMode;
            guessModeBtn.classList.toggle('active');
            guessModeBtn.innerHTML = isGuessMode ? 'Guess Mode ON' : 'Guess Mode';
        }

        function showGuessDialog(i, j) {
            currentGuessCell = { i, j };
            document.getElementById('guess-cell').textContent = '(' + i + ', ' + j + ')';
            const matchScore = parseInt(matchScoreInput.value);
            const mismatchScore = parseInt(mismatchScoreInput.value);
            const gapScore = parseInt(gapScoreInput.value);
            const diagScore = matrix[i - 1][j - 1] + (seq1[j - 1] === seq2[i - 1] ? matchScore : mismatchScore);
            const upScore = matrix[i - 1][j] + gapScore;
            const leftScore = matrix[i][j - 1] + gapScore;
            const correct = Math.max(0, diagScore, upScore, leftScore);
            document.getElementById('calc-details').innerHTML = '<strong>Diagonal:</strong> ' + matrix[i-1][j-1] + ' + ' + (seq1[j-1] === seq2[i-1] ? matchScore : mismatchScore) + ' = ' + diagScore + '<br><strong>Up:</strong> ' + matrix[i-1][j] + ' + ' + gapScore + ' = ' + upScore + '<br><strong>Left:</strong> ' + matrix[i][j-1] + ' + ' + gapScore + ' = ' + leftScore + '<br><strong>Max(0, ' + diagScore + ', ' + upScore + ', ' + leftScore + ') = ?</strong>';
            document.getElementById('guess-input').value = '';
            document.getElementById('guess-modal').classList.add('active');
            setTimeout(() => document.getElementById('guess-input').focus(), 100);
        }

        function submitGuess() {
            const guess = parseInt(document.getElementById('guess-input').value);
            const i = currentGuessCell.i, j = currentGuessCell.j;
            const matchScore = parseInt(matchScoreInput.value);
            const mismatchScore = parseInt(mismatchScoreInput.value);
            const gapScore = parseInt(gapScoreInput.value);
            const diagScore = matrix[i - 1][j - 1] + (seq1[j - 1] === seq2[i - 1] ? matchScore : mismatchScore);
            const upScore = matrix[i - 1][j] + gapScore;
            const leftScore = matrix[i][j - 1] + gapScore;
            const correct = Math.max(0, diagScore, upScore, leftScore);
            if (guess === correct) { closeGuess(); calculateNextCell(); }
            else {
                document.getElementById('correct-value').textContent = correct;
                document.getElementById('correct-calc').innerHTML = '<strong>Diagonal:</strong> ' + matrix[i-1][j-1] + ' + ' + (seq1[j-1] === seq2[i-1] ? matchScore : mismatchScore) + ' = ' + diagScore + '<br><strong>Up:</strong> ' + matrix[i-1][j] + ' + ' + gapScore + ' = ' + upScore + '<br><strong>Left:</strong> ' + matrix[i][j-1] + ' + ' + gapScore + ' = ' + leftScore + '<br><strong>Correct: Max(0, ' + diagScore + ', ' + upScore + ', ' + leftScore + ') = ' + correct + '</strong>';
                document.getElementById('guess-modal').classList.remove('active');
                document.getElementById('wrong-modal').classList.add('active');
            }
        }

        function closeGuess() { document.getElementById('guess-modal').classList.remove('active'); currentGuessCell = null; }
        function closeWrong() { document.getElementById('wrong-modal').classList.remove('active'); calculateNextCell(); }
        function closeCelebration() { document.getElementById('celebration-modal').classList.remove('active'); }

        function toggleAutoRun() {
            if (isAutoRunning) {
                clearInterval(autoInterval); isAutoRunning = false;
                autoBtn.innerHTML = 'Auto Run'; autoBtn.classList.remove('active');
            } else {
                if (currentStep >= seq1.length * seq2.length) {
                    currentStep = 0; matrix = matrix.map(row => row.map(() => 0));
                    maxScore = 0; maxPos = { i: 0, j: 0 };
                    history = [{ matrix: JSON.parse(JSON.stringify(matrix)), step: 0, maxScore: 0, maxPos: { i: 0, j: 0 } }];
                }
                isAutoRunning = true; autoBtn.innerHTML = 'Pause'; autoBtn.classList.add('active');
                autoInterval = setInterval(() => { if (!calculateNextCell()) toggleAutoRun(); }, 500);
            }
        }

        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#00f5ff', '#ff2d92', '#00ff9d', '#ffea00', '#b967ff', '#ff6b35'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                container.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        initBtn.addEventListener('click', initGame);
        backBtn.addEventListener('click', goBack);
        forwardBtn.addEventListener('click', goForward);
        guessModeBtn.addEventListener('click', toggleGuessMode);
        autoBtn.addEventListener('click', toggleAutoRun);

        matrixTable.addEventListener('click', (e) => {
            const cell = e.target;
            if (cell.tagName === 'TD' && cell.dataset.i && cell.dataset.j) {
                const i = parseInt(cell.dataset.i), j = parseInt(cell.dataset.j);
                const expectedStep = (i - 1) * seq1.length + (j - 1);
                if (isGuessMode && expectedStep === currentStep && matrix[i][j] === 0) {
                    showGuessDialog(i, j);
                }
            }
        });

        window.addEventListener('load', () => { initGame(); });
    </script>
</body>
</html>
